name: Validation
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m compileall -q community serve.py launcher.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/packages.mjs
      - run: node tests/parity.mjs
      - run: node tests/lesco_model.mjs
